<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1F4D3A"><link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png">
<title>Homely App Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: an iPhone running the Homely app, centered, with demo controls above it. iOS light appearance, Homely green as the app tint. */
:root{
  --brand:#1F4D3A; --tint:#2B6B4F; --sand:#EFE6D6; --tan:#C9A87C;
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.18); --bg:#F2F2F7; --cell:#FFFFFF; --fill:rgba(118,118,128,.12);
  --red:#FF3B30; --orange:#C26A00; --orange-bg:#FFF3E0; --bubble:#E9E9EB;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
html{touch-action:manipulation}
body{margin:0;background:var(--brand);font-family:var(--font);color:var(--label);-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px;
  display:flex;flex-direction:column;align-items:center;gap:10px;box-sizing:border-box;height:100%;max-height:100dvh}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--tan);outline-offset:2px}

/* demo controls outside the phone */
.caption{color:var(--sand);text-align:center;max-width:410px;display:flex;flex-direction:column;gap:3px}
.caption b{font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px}
.appicon{width:34px;height:34px;border-radius:8px;background:var(--sand);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.appicon svg{width:26px;height:26px}
.brandhead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.brandhead svg{width:34px;height:34px}
.brandhead span{font-size:30px;font-weight:800;color:var(--brand);letter-spacing:-.01em}
.caption span{font-size:13px;opacity:.8}
.mode{display:flex;padding:3px;background:rgba(0,0,0,.2);border-radius:11px;width:100%;max-width:410px}
.mode button{flex:1;border:0;background:transparent;color:var(--sand);padding:8px;border-radius:9px;font-weight:600;font-size:14px}
.mode button[aria-pressed="true"]{background:var(--sand);color:var(--brand)}
.demo-note{color:var(--sand);opacity:.7;font-size:12px;text-align:center;max-width:410px}

/* device */
.device{width:100%;max-width:410px;flex:1 1 auto;min-height:0;max-height:860px;background:#111;border-radius:58px;padding:11px;
  box-shadow:0 0 0 2px #3a3a3c, 0 30px 70px rgba(0,0,0,.45)}
.screen{position:relative;width:100%;height:100%;background:var(--bg);border-radius:47px;overflow:hidden;display:flex;flex-direction:column}
.status{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font-weight:600;font-size:16px;position:relative;z-index:6}
.status .icons{display:flex;gap:6px;align-items:center}
.status svg{height:12px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:35px;background:#000;border-radius:20px}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#000;z-index:30;pointer-events:none}
@media (max-width:440px){
  .device{padding:0;background:none;box-shadow:none;border-radius:0}
  .screen{border-radius:28px}
  .island,.homebar{display:none}
  .status{display:none}
}

/* screens */
.main{position:relative;flex:1;min-height:0}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.push{animation:push .32s cubic-bezier(.2,.8,.2,1)}
@keyframes push{from{transform:translateX(100%)}to{transform:none}}
.lt{display:flex;align-items:flex-end;justify-content:space-between;padding:6px 18px 8px}
.lt h1{font-size:34px;font-weight:700;letter-spacing:.012em;margin:0;line-height:1.15}
.pill{border:0;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;background:var(--fill);color:var(--tint);display:flex;align-items:center;gap:5px;margin-bottom:6px}
.pill.on{background:var(--brand);color:#fff}
.pill svg{width:13px;height:13px}

/* tab bar */
.tabbar{flex:none;height:84px;background:rgba(249,249,249,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--sep);display:flex;padding-top:6px}
.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:#999;font-size:10px;font-weight:500;position:relative}
.tabbar button[aria-selected="true"]{color:var(--tint)}
.tabbar svg{width:27px;height:27px}
.badge{position:absolute;top:-2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
@media (max-width:440px){.tabbar{height:64px}}

/* discover */
.deck{position:relative;flex:1;margin:2px 16px 0;min-height:0}
.card{position:absolute;inset:0;background:var(--cell);border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.10);display:flex;flex-direction:column;overflow:hidden;touch-action:none;user-select:none;will-change:transform}
.card.under{transform:scale(.95) translateY(10px);transition:transform .3s ease;animation:appear .25s ease}
@keyframes appear{from{opacity:0}}
.card.anim{transition:transform .32s ease, opacity .32s ease}
.photo{flex:1;min-height:110px;position:relative;display:flex;align-items:center;justify-content:center}
.avatar{overflow:hidden;width:108px;height:108px;border-radius:50%;background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;color:var(--brand);letter-spacing:.01em}
.vbadge{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:4px;background:var(--brand);color:#fff;font-size:12px;font-weight:600;padding:5px 9px;border-radius:99px}
.vbadge svg{width:13px;height:13px}
.avail{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.9);font-size:12px;font-weight:600;padding:5px 9px;border-radius:99px}
.stamp{position:absolute;top:54px;font-weight:800;font-size:28px;padding:3px 11px;border:4px solid;border-radius:10px;opacity:0;letter-spacing:.06em}
.stamp.like{left:16px;color:var(--tint);transform:rotate(-14deg)}
.stamp.nope{right:16px;color:var(--red);transform:rotate(14deg)}
.info{padding:12px 16px 14px;display:flex;flex-direction:column;gap:7px}
.name{font-size:22px;font-weight:700;line-height:1.15}
.name small{font-weight:400;font-size:20px;color:var(--label2)}
.meta{color:var(--label2);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;font-weight:500;padding:4px 9px;border-radius:99px;background:var(--fill)}
.bio{font-size:13.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.checks{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--tint);font-weight:600;padding-top:7px;border-top:.5px solid var(--sep)}
.checks span{display:flex;align-items:center;gap:3px}
.checks svg{width:12px;height:12px}
.actions{display:flex;justify-content:center;align-items:center;gap:22px;padding:12px 0 4px}
.round{width:58px;height:58px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.round svg{width:24px;height:24px}
.round.no{color:var(--red)}
.round.yes{background:var(--tint);color:#fff;width:66px;height:66px}
.round:disabled{opacity:.4;cursor:default}
.left{font-size:12px;color:var(--label2);text-align:center;padding:4px 0 8px}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:24px;color:var(--label2)}
.empty h3{color:var(--label);font-size:20px;margin:0}
.empty p{margin:0;font-size:15px}

/* grouped lists */
.sec{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;padding:18px 34px 7px}
.foot{font-size:13px;color:var(--label2);padding:7px 34px 0;line-height:1.35}
.group{margin:0 16px;background:var(--cell);border-radius:12px;overflow:hidden}
.cellr{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:44px;position:relative;width:100%;border:0;background:var(--cell);text-align:left;font-size:17px;color:var(--label)}
.cellr+.cellr::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);border-top:.5px solid var(--sep)}
button.cellr:active{background:#E5E5EA}
.av{overflow:hidden;width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--brand);font-size:17px}
.av.sm{width:34px;height:34px;font-size:13px}
.ct{flex:1;min-width:0}
.ct b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct span{display:block;font-size:14px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct span.unread{color:var(--label);font-weight:500}
.time{font-size:14px;color:var(--label2);align-self:flex-start;padding-top:2px;display:flex;align-items:center;gap:4px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--tint);flex:none}
.chev{color:var(--label3);flex:none}
.chev svg{width:8px;height:14px;display:block}
.tag{font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;flex:none}
.tag.ok{background:#E3F1E9;color:var(--tint)}
.tag.paused{background:var(--orange-bg);color:var(--orange)}
.get{border:0;background:var(--fill);color:var(--tint);font-weight:700;font-size:14px;padding:6px 16px;border-radius:99px;flex:none;min-width:72px}
.get.done{background:transparent;color:var(--label2)}
.logo{width:46px;height:46px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff}

/* chat */
.nav{flex:none;display:flex;align-items:center;gap:6px;padding:4px 10px 8px;background:rgba(249,249,249,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid var(--sep)}
.back{border:0;background:none;color:var(--tint);font-size:17px;display:flex;align-items:center;gap:2px;padding:6px 4px;flex:none}
.back svg{width:12px;height:20px}
.who{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.who .nm{font-size:12px;font-weight:500;display:flex;align-items:center;gap:3px}
.who .vf{font-size:11px;color:var(--tint);font-weight:600}
.more{border:0;background:var(--fill);color:var(--tint);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.more svg{width:18px;height:18px}
.strip{flex:none;display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--cell);border-bottom:.5px solid var(--sep);font-size:13px;color:var(--label2)}
.strip span{flex:1;line-height:1.3}
.strip.paused{background:var(--orange-bg);color:var(--orange)}
.strip.hired{color:var(--tint);font-weight:600}
.sbtn{border:0;background:var(--tint);color:#fff;font-weight:600;font-size:14px;padding:6px 14px;border-radius:99px;flex:none}
.sbtn.red{background:transparent;color:var(--red);padding:6px 4px}
.thread{flex:1;min-height:0;overflow-y:auto;padding:12px 12px 8px;display:flex;flex-direction:column;gap:3px}
.sys{align-self:center;text-align:center;font-size:11.5px;color:var(--label2);padding:10px 20px 6px;line-height:1.35}
.sys b{font-weight:600}
.bub{max-width:76%;padding:8px 13px;border-radius:19px;font-size:16px;line-height:1.3;word-wrap:break-word}
.bub.me{align-self:flex-end;background:var(--tint);color:#fff;border-bottom-right-radius:6px}
.bub.them{align-self:flex-start;background:var(--bubble);color:var(--label);border-bottom-left-radius:6px}
.bub.me+.bub.them,.bub.them+.bub.me{margin-top:8px}
.read{align-self:flex-end;font-size:11px;color:var(--label2);padding:2px 4px 0}
.typing{align-self:flex-start;background:var(--bubble);border-radius:19px;padding:12px 14px;display:flex;gap:4px;margin-top:8px}
.typing i{width:8px;height:8px;border-radius:50%;background:#8E8E93;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
.quick{flex:none;display:flex;gap:6px;overflow-x:auto;padding:6px 12px 2px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;border:1px solid var(--sep);background:var(--cell);color:var(--tint);font-size:14px;padding:7px 12px;border-radius:99px;white-space:nowrap}
.composer{flex:none;display:flex;align-items:flex-end;gap:8px;padding:8px 12px 30px;background:var(--bg)}
@media (max-width:440px){.composer{padding-bottom:12px}}
.plus{width:34px;height:34px;border-radius:50%;border:0;background:var(--fill);color:#8E8E93;display:flex;align-items:center;justify-content:center;flex:none}
.plus svg{width:16px;height:16px}
.field{flex:1;display:flex;align-items:center;border:1px solid #D1D1D6;border-radius:19px;background:#fff;padding:3px 3px 3px 14px;min-width:0}
.field input{flex:1;border:0;outline:0;font:inherit;font-size:16px;padding:5px 0;background:transparent;min-width:0}
.send{width:30px;height:30px;border-radius:50%;border:0;background:var(--tint);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.send:disabled{background:#C7C7CC}
.send svg{width:16px;height:16px}
.composer.off{opacity:.5;pointer-events:none}

/* sheets */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;flex-direction:column;justify-content:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);border-radius:14px 14px 0 0;padding:8px 16px 34px;display:flex;flex-direction:column;gap:12px;animation:up .3s cubic-bezier(.2,.8,.2,1);max-height:92%;overflow:auto}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:36px;height:5px;border-radius:3px;background:#C7C7CC;align-self:center}
.sheet h3{font-size:22px;font-weight:700;margin:4px 0 0;text-align:center}
.sheet p{margin:0;font-size:15px;color:var(--label2);text-align:center;line-height:1.4}
.price{text-align:center;font-size:34px;font-weight:700;color:var(--brand)}
.price small{font-size:15px;font-weight:500;color:var(--label2)}
.sheet .group{margin:0}
.big{border:0;width:100%;height:50px;border-radius:14px;font-size:17px;font-weight:600;background:var(--tint);color:#fff}
.big.plain{background:transparent;color:var(--tint)}
.big.red{background:var(--red)}
.big:disabled{opacity:.4;cursor:default}
.fine{font-size:12px;color:var(--label2);text-align:center}
.feat{display:flex;gap:10px;align-items:center;font-size:16px}
.feat svg{width:20px;height:20px;color:var(--tint);flex:none}
.radio .ck{margin-left:auto;color:var(--tint);visibility:hidden}
.radio[aria-checked="true"] .ck{visibility:visible}
.radio .ck svg{width:16px;height:16px;display:block}
.asheet{padding:0 8px 30px;display:flex;flex-direction:column;gap:8px;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.agroup{background:rgba(250,250,250,.97);border-radius:14px;overflow:hidden}
.agroup .ah{font-size:13px;color:var(--label2);text-align:center;padding:14px 16px;border-bottom:.5px solid var(--sep)}
.agroup button{display:block;width:100%;border:0;background:none;height:57px;font-size:20px;color:#007AFF}
.agroup button+button{border-top:.5px solid var(--sep)}
.agroup button.red{color:var(--red)}
.agroup button.bold{font-weight:600}

/* banner notification */
.banner{position:absolute;top:54px;left:10px;right:10px;z-index:40;background:rgba(245,245,245,.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:20px;padding:11px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.18);animation:drop .35s cubic-bezier(.2,.8,.2,1)}
@keyframes drop{from{transform:translateY(-130%)}}
@media (max-width:440px){.banner{top:10px}}
.banner .appi{width:36px;height:36px;border-radius:9px;background:var(--brand);display:flex;align-items:center;justify-content:center;flex:none}
.banner .appi svg{width:24px;height:24px}
.banner .bt{flex:1;min-width:0}
.banner .bt b{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.banner .bt b em{font-style:normal;font-weight:400;color:var(--label2);font-size:13px}
.banner .bt span{display:block;font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* worker onboarding */
.wnav{flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 16px 4px}
.wnav .stepn{font-size:15px;color:var(--label2)}
.progress{display:flex;gap:5px;padding:4px 18px 4px}
.progress i{flex:1;height:4px;border-radius:2px;background:#D1D1D6}
.progress i.on{background:var(--tint)}
.wbody{flex:1;min-height:0;overflow-y:auto;padding-bottom:16px}
.wbody .lt h1{font-size:30px}
.lead{font-size:15px;color:var(--label2);padding:0 18px 4px;margin:0;line-height:1.4}
.cellr label{font-size:17px;flex:none;width:118px}
.cellr input,.cellr select{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:17px;color:var(--label2);text-align:right;background:transparent;-webkit-appearance:none;appearance:none}
.cellr select{direction:rtl}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;width:100%}
.seg button{flex:1;border:0;background:none;font-size:13px;font-weight:500;padding:7px 2px;border-radius:7px;color:var(--label)}
.seg button[aria-pressed="true"]{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12);font-weight:600}
.pick{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px}
.pick button{border:0;background:var(--fill);color:var(--label);font-size:14px;font-weight:500;padding:7px 12px;border-radius:99px}
.pick button[aria-pressed="true"]{background:var(--tint);color:#fff}
.ib{width:30px;height:30px;border-radius:7px;background:var(--tint);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.ib svg{width:18px;height:18px}
.ib.done{background:#34C759}
.spin{width:20px;height:20px;border:2.5px solid #D1D1D6;border-top-color:var(--tint);border-radius:50%;animation:rot .7s linear infinite;flex:none;margin:0 26px}
@keyframes rot{to{transform:rotate(360deg)}}
.wfoot{flex:none;padding:10px 16px 30px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
@media (max-width:440px){.wfoot{padding-bottom:14px}}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 28px 10px}
.hero .circ{width:92px;height:92px;border-radius:50%;background:#E3F1E9;color:var(--tint);display:flex;align-items:center;justify-content:center}
.hero .circ svg{width:46px;height:46px}
.hero h2{font-size:26px;font-weight:700;margin:6px 0 0;line-height:1.2}
.hero p{margin:0;font-size:15px;color:var(--label2);line-height:1.45}
.card.static{position:relative;inset:auto;height:430px;margin:12px 16px 0;touch-action:auto}
.avatar svg,.av svg{width:100%;height:100%;display:block}
.rate{display:flex;gap:5px;align-items:center;font-size:13.5px;color:var(--label2)}
.rate .star{color:#C98A00;font-weight:600}
@media (max-height:800px){.card .bio{display:none}}
@media (max-height:640px){.card .checks{display:none}.lt h1{font-size:28px}.brandhead span{font-size:26px}.photo{min-height:64px}.card .avatar{width:76px;height:76px}.vbadge,.avail{top:8px}}
/* launch screen */
.launch{position:absolute;inset:0;z-index:60;background:var(--brand);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .45s ease;cursor:pointer}
.launch.out{opacity:0;pointer-events:none}
.launch svg{width:124px;height:124px;overflow:visible}

 Cooking:'years in family homes. Loves cooking traditional Mexican food and can plan the weekly menu.',
 Childcare:'years looking after kids of all ages. Patient, playful and very responsible.',
 'Elder care':'years caring for older adults: meals, walks and medication schedules.',
 Ironing:'years in family homes. Detailed with clothes and delicate fabrics.',
 'Pet care':'years in family homes. Animal lover who can walk and feed pets during the day.',
 Laundry:'years in family homes. Takes care of the whole week\'s laundry and keeps closets tidy.',
 Gardening:'years keeping gardens and patios looking great. Also helps with general cleaning.'};
let genId=1000;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function genWorker(f){
  f=f||filt;
  const av=f.av!=='All'?f.av:pick(AVAILS);
  const area=f.areas.length?pick(f.areas):pick(AREAS);
  const sk=[]; if(f.sk.length) sk.push(pick(f.sk));
  while(sk.length<3){const x=pick(GSK); if(!sk.includes(x)) sk.push(x)}
  const male=Math.random()<.1&&!sk.includes('Childcare');
  const n=male?pick(GM):pick(GF);
  const a=rint(24,57), y=rint(2,Math.min(28,a-20));
  const h=rint(7,9);
  const tail=av==='Full-time'?'Looking for a full-time position with one family.':av==='Part-time'?'Available a few days a week.':`Available entrada por salida from ${h} am to ${h-2} pm.`;
  const w={n,a,area,y,av,sk,ref:rint(2,4),bio:`${y} ${GBIO[sk[0]]} ${tail}`,id:genId++,gen:true,tone:pick(TONES),ini:initials(n),
    hair:male?3:pick([0,1,2,3,4,6,7,8]),r:Math.round((4.5+Math.random()*.5)*10)/10,rc:rint(3,60),km:Math.round(((AREA_KM[area]||8)+Math.random()*3-1.5)*10)/10};
  W.push(w); return w;
}

function renderDeck(backIn){
  const d=$('deck'); d.innerHTML='';
  deck=pool(); while(deck.length<2){genWorker(filt); deck=pool()}
  const rest=deck.length;
  if(rest<=0){
    d.innerHTML=filtOn()?`<div class="empty"><h3>No workers match your filters</h3><p>Try a different availability, area or skill.</p><button class="big" id="again" type="button" style="width:auto;padding:0 22px;margin-top:8px">Clear Filters</button></div>`
     :`<div class="empty"><h3>You're all caught up</h3><p>New verified workers join every week in your area.</p><button class="big" id="again" type="button" style="width:auto;padding:0 22px;margin-top:8px">Start over</button></div>`;
    $('again').onclick=()=>{if(filtOn()){filt={av:'All',areas:[],sk:[]}}else{seen=new Set();hist=[]}renderDeck()};
  } else {
    [1,0].forEach(o=>{const w=deck[o]; if(!w) return;
      const c=document.createElement('div'); c.className='card'+(o?' under':(backIn?' back-in':'')); c.innerHTML=cardHTML(w); d.appendChild(c); if(!o) drag(c,w);});
  }
  $('noBtn').disabled=$('yesBtn').disabled=rest<=0;
  $('undoBtn').classList.toggle('locked',!premium);
  $('fdot').hidden=!filtOn();
  $('left').textContent=premium?'Premium · unlimited swipes':`${Math.max(0,FREE-used)} free swipes left today`;
  const pb=$('premBtn');
  pb.innerHTML=premium?'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 12h12l1-7-4 3-3-5-3 5-4-3 1 7Z"/></svg>Premium':'Free plan';
  pb.classList.toggle('on',premium);
}
function drag(c,w){
  let sx=0,sy=0,dx=0,dy=0,down=false;const like=c.querySelector('.like'),nope=c.querySelector('.nope');
  const under=()=>$('deck').querySelector('.card.under');
  c.addEventListener('pointerdown',e=>{down=true;dx=dy=0;sx=e.clientX;sy=e.clientY;c.setPointerCapture(e.pointerId);c.classList.remove('anim');const u=under();if(u)u.style.transition='none'});
  c.addEventListener('pointermove',e=>{if(!down)return;dx=e.clientX-sx;dy=e.clientY-sy;
    c.style.transform=`translate(${dx}px,${dy*.3}px) rotate(${dx/18}deg)`;
    like.style.opacity=Math.max(0,Math.min(1,dx/90));nope.style.opacity=Math.max(0,Math.min(1,-dx/90));
    const u=under();if(u){const k=Math.min(1,Math.abs(dx)/150);u.style.transform=`scale(${.95+.05*k}) translateY(${10*(1-k)}px)`}});
  const end=()=>{if(!down)return;down=false;
    const u=under();if(u)u.style.transition='';
    if(Math.abs(dx)<6&&Math.abs(dy)<6){if(u)u.style.transform='';c.style.transform='';dx=dy=0;openProfile(w,'deck');return}
    if(Math.abs(dx)>100) swipe(dx>0); else {c.classList.add('anim');c.style.transform='';like.style.opacity=nope.style.opacity=0;if(u)u.style.transform=''}
    dx=dy=0};
  c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
}
function swipe(right){
  if(!deck.length) return;
  const c=$('deck').querySelector('.card:not(.under)'), u=$('deck').querySelector('.card.under');
  if(!premium&&used>=FREE){ if(c){c.classList.add('anim');c.style.transform='';c.querySelectorAll('.stamp').forEach(s=>s.style.opacity=0)} if(u){u.style.transition='';u.style.transform=''} paywall(); return }
  if(u){u.style.transition='';u.style.transform='none'}
  const w=deck[0];
  if(c){c.classList.add('anim');c.style.transform=`translate(${right?520:-520}px,40px) rotate(${right?24:-24}deg)`;c.style.opacity=0;c.querySelector(right?'.like':'.nope').style.opacity=1}
  used++; seen.add(w.id); hist.push({id:w.id,right}); if(undoTop===w.id) undoTop=null;
  if(right){
    const b=document.createElementNS('http://www.w3.org/2000/svg','svg'); b.setAttribute('viewBox','0 0 24 24'); b.setAttribute('class','burst');
    b.innerHTML='<path d="M12 21s-7.5-4.6-9.6-9.3C1 8.4 3 5 6.4 5c2 0 3.4 1.1 4.1 2.2h3c.7-1.1 2.1-2.2 4.1-2.2C21 5 23 8.4 21.6 11.7 19.5 16.4 12 21 12 21Z"/>';
    $('deck').appendChild(b); setTimeout(()=>b.remove(),700);
    status[w.id]='saved'; savedOrder.unshift(w.id);
    chats[w.id]=[{f:'sys',t:`<b>You saved ${esc(w.n)}</b> · Today<br>Say hi to ask about availability or set up an interview.`}];
    banner('Homely',`${first(w)} was added to Saved. Say hi in Messages.`);
  }
  setTimeout(renderDeck,260);
}
$('noBtn').onclick=()=>swipe(false); $('yesBtn').onclick=()=>swipe(true);
function undo(){
  if(!premium){paywall('undo');return}
  const h=hist[hist.length-1];
  if(!h){banner('Homely','Nothing to undo yet.');return}
  if(h.right&&status[h.id]&&status[h.id]!=='saved'){banner('Homely','You already hired or reported this worker, so that swipe can\'t be undone.');return}
  hist.pop(); seen.delete(h.id);
  if(h.right){delete status[h.id];savedOrder=savedOrder.filter(x=>x!==h.id);delete chats[h.id];unread.delete(h.id);updBadge()}
  undoTop=h.id; renderDeck(true);
}

/* ---------- Chat ---------- */
const QUICK=['Hi! Are you available to start Monday?','What\'s your rate?','Could we do an interview this week?'];
function replyFor(w,t){
  const s=t.toLowerCase();
  if(/rate|pay|cobra|salary|much|price|cost/.test(s)) return w.av==='Full-time'?'For full-time I usually ask $10,000 MXN a month, with Sundays off. We can talk about it.':`For ${w.av.toLowerCase()} I usually ask $550 MXN per day. We can talk about it.`;
  if(/interview|meet|visit|see you/.test(s)) return 'Of course. I can come by Thursday at 10:00 so you can meet me. Does that work?';
  if(/monday|available|start|when/.test(s)) return `Yes! I can start this Monday. I'm looking for ${w.av.toLowerCase()} work. What time would you need me?`;
  if(/reference/.test(s)) return 'My references are already verified in Homely, but I\'m happy to answer any questions.';
  if(/thursday|works|perfect|great|ok|sure|yes/.test(s)) return 'Perfect, see you then! You can confirm the hire here in Homely whenever you\'re ready.';
  if(/^(hi|hello|hola|hey)\b/.test(s)) return `Hi! Thanks for saving my profile. How can I help?`;
  return 'Thanks for your message! Happy to tell you more about my experience.';
}
function openChat(id,from){
  chatId=id; chatFrom=from; unread.delete(id); updBadge();
  const S=$('sChat'); S.hidden=false; S.classList.remove('push'); void S.offsetWidth; S.classList.add('push');
  $('tabbar').hidden=true; renderChat(true);
}
function closeChat(){chatId=null;$('sChat').hidden=true;$('tabbar').hidden=false;showTab(chatFrom)}
function renderChat(focusInput){
  const w=byId(chatId), s=status[chatId], m=chats[chatId]||(chats[chatId]=[]);
  const strip=s==='paused'?`<div class="strip paused"><span>This profile is paused while our Trust &amp; Safety team reviews your report. We'll reply within 24 hours.</span></div>`
   :s==='hired'?`<div class="strip hired"><span>✓ Hired through Homely</span><button class="sbtn red" type="button" id="cReport">Report</button></div>`
   :`<div class="strip"><span>Keep the hire in Homely so you stay protected.</span><button class="sbtn" type="button" id="cHire">Hire</button></div>`;
  let lastMe=-1; m.forEach((x,i)=>{if(x.f==='me')lastMe=i});
  const thread=m.map((x,i)=>x.f==='sys'?`<div class="sys">${x.t}</div>`:`<div class="bub ${x.f}">${esc(x.t)}</div>${i===lastMe&&i===m.length-1?'<div class="read">Delivered</div>':''}`).join('');
  $('sChat').innerHTML=`
   <div class="nav"><button class="back" type="button" id="cBack"><svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>${chatFrom}</button>
    <div class="who" id="cWho" role="button" tabindex="0" style="cursor:pointer"><div class="av sm" style="background:${w.tone}">${sil(w)}</div><div class="nm">${esc(w.n)}</div><div class="vf">${s==='paused'?'Under review':'✓ Verified'}</div></div>
    <button class="more" type="button" id="cMore" aria-label="More"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button></div>
   ${strip}
   <div class="thread" id="thread">${thread}</div>
   ${s==='paused'?'':`<div class="quick" id="quick">${QUICK.map(q=>`<button type="button">${esc(q)}</button>`).join('')}</div>`}
   <form class="composer${s==='paused'?' off':''}" id="cForm"><button class="plus" type="button" aria-label="Attach"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 2v12M2 8h12"/></svg></button>
    <div class="field"><input id="cInput" placeholder="Message" autocomplete="off" aria-label="Message"><button class="send" type="submit" id="cSend" disabled aria-label="Send"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg></button></div></form>`;
  const th=$('thread'); th.scrollTop=th.scrollHeight;
  $('cBack').onclick=closeChat;
  $('cMore').onclick=()=>actionSheet(w);
  $('cWho').onclick=()=>openProfile(w,'chat');
  if($('cHire')) $('cHire').onclick=()=>hireSheet(w);
  if($('cReport')) $('cReport').onclick=()=>reportSheet(w);
  const inp=$('cInput');
  inp.oninput=()=>{$('cSend').disabled=!inp.value.trim()};
  $('cForm').onsubmit=e=>{e.preventDefault();const t=inp.value.trim();if(t)send(t)};
  if($('quick')) $('quick').querySelectorAll('button').forEach(b=>b.onclick=()=>send(b.textContent));
}
function send(t){
  const id=chatId, w=byId(id);
  chats[id].push({f:'me',t}); renderChat();
  const th=$('thread'); const typ=document.createElement('div'); typ.className='typing'; typ.innerHTML='<i></i><i></i><i></i>';
  setTimeout(()=>{ if(chatId===id&&$('thread')){$('thread').appendChild(typ);$('thread').scrollTop=1e6} },600);
  setTimeout(()=>{
    if(status[id]==='paused') return;
    const r=replyFor(w,t); chats[id].push({f:'them',t:r});
    if(chatId===id) renderChat(); else {unread.add(id);updBadge();banner(w.n,r);if(tabNow==='Messages')renderMessages()}
  },2000);
}

const SKILLS=['Cleaning','Cooking','Childcare','Ironing','Elder care','Pet care','Laundry','Gardening'];
const IC={
 id:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.6-1.4 1.7-2 3-2s2.4.6 3 2M15 10h3M15 13h3"/></svg>',
 selfie:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="10" r="3"/><path d="M7.5 17c1-2 2.6-3 4.5-3s3.5 1 4.5 3"/></svg>',
 refs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 19c.8-3 3.2-5 6-5s5.2 2 6 5"/><path d="M16 5.5a3 3 0 0 1 0 5M18 14c1.6.7 2.6 2.4 3 5"/></svg>',
 bg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg>'
};
const VSTEPS=[['id','Official ID','INE or passport','Upload'],['selfie','Selfie Check','Confirms the ID is you','Start'],['refs','References','2 previous employers','Add'],['bg','Background Check','Third-party provider','Accept']];
let ws=0, vdone=new Set(), vbusy=null;
const ME0={n:'Lucía Hernández',a:31,y:6,area:'Tlalpan',av:'Entrada por salida',sk:['Cleaning','Cooking','Childcare']};
let me={...ME0,sk:[...ME0.sk]};
const prog=()=>`<div class="progress">${[0,1,2,3].map(i=>`<i class="${i<=ws?'on':''}"></i>`).join('')}</div>`;
function wnav(left){return `<div class="wnav">${left?`<button class="back" type="button" id="wBack"><svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>Back</button>`:'<span></span>'}<span class="stepn">Step ${ws+1} of 4</span></div>${prog()}`}
function wrender(){
  const V=$('sWorker');
  if(ws===0){
    V.innerHTML=`${wnav(false)}<div class="wbody"><div class="lt"><h1>Create your profile</h1></div><p class="lead">Employers in Mexico City see this once you're verified.</p>
     <div class="sec">About you</div><div class="group">
      <div class="cellr"><label for="wName">Name</label><input id="wName" value="${esc(me.n)}"></div>
      <div class="cellr"><label for="wAge">Age</label><input id="wAge" type="number" min="18" max="80" value="${me.a}"></div>
      <div class="cellr"><label for="wYears">Experience</label><input id="wYears" type="number" min="0" max="50" value="${me.y}"></div>
      <div class="cellr"><label for="wArea">Alcaldía</label><select id="wArea">${AREAS.map(a=>`<option${a===me.area?' selected':''}>${a}</option>`).join('')}</select>${CHEV}</div></div>
     <div class="sec">Availability</div><div class="group"><div class="cellr"><div class="seg" id="wAvail">${AVAILS.map(a=>`<button type="button" aria-pressed="${a===me.av}">${a}</button>`).join('')}</div></div></div>
     <div class="sec">Skills</div><div class="group"><div class="pick" id="wSkills">${SKILLS.map(s=>`<button type="button" aria-pressed="${me.sk.includes(s)}">${s}</button>`).join('')}</div></div>
     <div class="foot">Homely is always free for workers.</div></div>
     <div class="wfoot"><button class="big" type="button" id="wNext">Continue</button></div>`;
    $('wAvail').querySelectorAll('button').forEach(b=>b.onclick=()=>{me.av=b.textContent;$('wAvail').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
    $('wSkills').querySelectorAll('button').forEach(b=>b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);me.sk=on?[...me.sk,b.textContent]:me.sk.filter(s=>s!==b.textContent)});
    $('wNext').onclick=()=>{me.n=$('wName').value.trim()||'Lucía Hernández';me.a=+$('wAge').value||31;me.y=+$('wYears').value||0;me.area=$('wArea').value;if(!me.sk.length)me.sk=['Cleaning'];ws=1;wrender()};
  } else if(ws===1){
    const all=vdone.size===VSTEPS.length;
    V.innerHTML=`${wnav(true)}<div class="wbody"><div class="lt"><h1>Verify your identity</h1></div><p class="lead">Every worker on Homely completes these checks. They're why employers trust your profile.</p>
     <div class="sec">Required</div><div class="group">${VSTEPS.map(([k,t,d,a])=>`<div class="cellr" style="--inset:58px"><div class="ib${vdone.has(k)?' done':''}">${vdone.has(k)?CHECK:IC[k]}</div>
       <div class="ct"><b>${t}</b><span>${d}</span></div>${vdone.has(k)?'<span class="tag ok">Done</span>':vbusy===k?'<span class="spin"></span>':`<button class="get" type="button" data-k="${k}">${a}</button>`}</div>`).join('')}</div>
     <div class="foot">Demo only. Nothing is uploaded and no real check is run.</div></div>
     <div class="wfoot"><button class="big" type="button" id="wSend"${all?'':' disabled'}>Send for Review</button></div>`;
    $('wBack').onclick=()=>{ws=0;wrender()};
    V.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(vbusy)return;vbusy=b.dataset.k;wrender();setTimeout(()=>{vdone.add(vbusy);vbusy=null;if(ws===1)wrender()},700)});
    $('wSend').onclick=()=>{ws=2;wrender()};
  } else if(ws===2){
    V.innerHTML=`${wnav(false)}<div class="wbody"><div class="hero"><div class="circ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
     <h2>Your profile is under review</h2><p>Our Trust &amp; Safety team checks every application. You'll get a notification within 24 to 48 hours.</p></div></div>
     <div class="wfoot"><button class="big plain" type="button" id="wSkip">Skip Ahead (Demo)</button></div>`;
    $('wSkip').onclick=()=>{golive();ws=3;wrender();banner('Homely','You\'re verified! Your profile is now live.')};
  } else {
    const w=byId(me.id);
    V.innerHTML=`${wnav(false)}<div class="wbody"><div class="lt"><h1>You're verified</h1></div><p class="lead">Your profile is live. This is exactly what employers see.</p>
     <div class="card static">${cardHTML(w)}</div></div>
     <div class="wfoot"><button class="big" type="button" id="wSee">See It as an Employer</button><button class="big plain" type="button" id="wReset">Start a New Sign-Up</button></div>`;
    $('wSee').onclick=()=>setMode('hire');
    $('wReset').onclick=()=>{ws=0;vdone=new Set();wrender()};
  }
}
function golive(){
  const w={n:me.n,a:me.a,area:me.area,y:me.y,av:me.av,sk:me.sk.slice(0,3),ref:2,id:Date.now(),tone:'#C8D5C4',ini:initials(me.n),hair:0,r:null,rc:0,km:AREA_KM[me.area]||8,fresh:true,
    bio:`New on Homely. ${me.y} years of experience in family homes, looking for ${me.av.toLowerCase()} work in ${me.area}.`};
  me.id=w.id; W.push(w); renderDeck();
}
function setMode(m){
  const work=m==='work';
  $('modeHire').setAttribute('aria-pressed',!work); $('modeWork').setAttribute('aria-pressed',work);
  closeOv(); $('bannerHost').innerHTML='';
  $('sWP').hidden=true;
  if(work){ $('sChat').hidden=true; chatId=null; TABS.forEach(x=>$('s'+x).hidden=true); $('tabbar').hidden=true; $('sWorker').hidden=false; wrender(); }
  else { $('sWorker').hidden=true; $('tabbar').hidden=false; showTab('Discover'); }
}
$('modeHire').onclick=()=>setMode('hire'); $('modeWork').onclick=()=>setMode('work');

/* ---------- Full worker profile ---------- */
function openProfile(w,from){
  const d=w.days||DAYS[w.av]||[1,1,1,1,1,0,0];
  const revs=w.rc?w.sk.slice(0,2).map((x,i)=>`<div class="rev"><b>${RN[(w.id+i)%RN.length]}<em>${i?'Oct 2026':'Nov 2026'}</em></b><span class="stars">★★★★★</span>${esc(RV[x]||'Great experience, highly recommend.')}</div>`).join('')
   :'<div class="rev" style="color:var(--label2)">No reviews yet. Reviews appear after the first hire through Homely.</div>';
  const S=$('sWP');
  S.innerHTML=`<div class="pv-body">
   <div class="pv-top" style="background:${w.tone}"><button class="pv-close" id="pvClose" type="button" aria-label="Close"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 2l10 10M12 2 2 12"/></svg></button>
    <div class="vbadge" style="left:auto;right:12px">${CHECK}Verified</div><div class="avatar">${sil(w)}</div></div>
   <div class="pv-head"><h2>${esc(w.n)} <small>${w.a}</small></h2><div class="meta">${esc(w.area)} · ${w.km} km away</div><div class="rate">${rateHTML(w,true)}</div></div>
   <div class="sec">About</div><div class="group"><div class="pv-txt">${esc(w.bio)}</div></div>
   <div class="sec">Details</div><div class="group">
    <div class="cellr">Availability<span class="val">${esc(w.av)}</span></div>
    <div class="cellr">Experience<span class="val">${w.y} years</span></div>
    <div class="cellr">Skills<span class="val">${w.sk.map(esc).join(', ')}</span></div></div>
   <div class="sec">Usual week</div><div class="group"><div class="week">${['M','T','W','T','F','S','S'].map((l,i)=>`<div><i class="${d[i]?'on':''}"></i>${l}</div>`).join('')}</div></div>
   <div class="sec">Verification</div><div class="group">${[['Official ID (INE)','Verified'],['Selfie check','Verified'],['Background check','Clear'],[`${w.ref} references`,'Confirmed']].map(([a,b])=>`<div class="cellr" style="--inset:58px"><div class="ib">${CHECK}</div><div class="ct"><b>${a}</b></div><span class="val" style="font-size:15px;color:var(--tint);font-weight:600">${b}</span></div>`).join('')}</div>
   <div class="sec">Reviews</div><div class="group">${revs}</div><div style="height:24px"></div></div>
   <div class="pv-actions">${from==='deck'?`<button class="big ghost" id="pvNo" type="button">Pass</button><button class="big" id="pvYes" type="button">Save</button>`:`<button class="big" id="pvBack" type="button">Back to Chat</button>`}</div>`;
  S.hidden=false; S.classList.remove('push'); void S.offsetWidth; S.classList.add('push');
  $('tabbar').hidden=true;
  $('pvClose').onclick=closeProfile;
  if($('pvNo')) $('pvNo').onclick=()=>{closeProfile();setTimeout(()=>swipe(false),120)};
  if($('pvYes')) $('pvYes').onclick=()=>{closeProfile();setTimeout(()=>swipe(true),120)};
  if($('pvBack')) $('pvBack').onclick=closeProfile;
}
function closeProfile(){$('sWP').hidden=true; if(chatId===null&&$('sWorker').hidden) $('tabbar').hidden=false}

/* ---------- Filters ---------- */
function filterSheet(){
  const f={av:filt.av,areas:[...filt.areas],sk:[...filt.sk]};
  const AVL=[['All','All'],['Full-time','Full-time'],['Part-time','Part-time'],['Entrada por salida','Entrada/salida']];
  const AR=[...new Set(W.map(w=>w.area))].sort((a,b)=>a.localeCompare(b));
  const SK=['Cleaning','Cooking','Childcare','Ironing','Elder care','Pet care','Gardening'];
  overlay(`<div class="sheet"><div class="grab"></div>
   <div class="fhead"><button type="button" id="fClear">Clear</button><h3 style="margin:0">Filters</h3><button type="button" id="fDone" style="font-weight:600">Done</button></div>
   <div class="fsec">Availability</div><div class="group"><div class="cellr"><div class="seg" id="fAv">${AVL.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${v===f.av}">${l}</button>`).join('')}</div></div></div>
   <div class="fsec">Alcaldía</div><div class="group"><div class="pick" id="fAr">${AR.map(a=>`<button type="button" data-v="${esc(a)}" aria-pressed="${f.areas.includes(a)}">${esc(a)}</button>`).join('')}</div></div>
   <div class="fsec">Skills</div><div class="group"><div class="pick" id="fSk">${SK.map(a=>`<button type="button" data-v="${a}" aria-pressed="${f.sk.includes(a)}">${a}</button>`).join('')}</div></div>
   <button class="big" type="button" id="fShow"></button></div>`);
  const upd=()=>{
    $('fAv').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===f.av));
    $('fAr').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',f.areas.includes(b.dataset.v)));
    $('fSk').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',f.sk.includes(b.dataset.v)));
    const n=pool(f).length; $('fShow').textContent=n?`Show ${n}+ workers`:'Show workers';
  };
  const tog=(arr,v)=>{const i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1)};
  $('fAv').querySelectorAll('button').forEach(b=>b.onclick=()=>{f.av=b.dataset.v;upd()});
  $('fAr').querySelectorAll('button').forEach(b=>b.onclick=()=>{tog(f.areas,b.dataset.v);upd()});
  $('fSk').querySelectorAll('button').forEach(b=>b.onclick=()=>{tog(f.sk,b.dataset.v);upd()});
  $('fClear').onclick=()=>{f.av='All';f.areas=[];f.sk=[];upd()};
  const apply=()=>{filt=f;closeOv();renderDeck()};
  $('fDone').onclick=apply; $('fShow').onclick=apply;
  upd();
}

/* ---------- Profile tab ---------- */
function renderAccount(){
  const hires=Object.values(status).filter(x=>x==='hired').length;
  $('acct').innerHTML=`<div class="group"><div class="me-card"><div class="av" style="background:#DCCFB0">${sil({hair:3})}</div><div class="ct"><b style="font-size:20px">Carlos H.</b><span>Employer account · Santa Fe, CDMX</span></div></div></div>
   <div class="sec">Plan</div><div class="group"><div class="cellr">${premium?'Homely Premium':'Free plan'}<span class="val">${premium?'$'+PREMIUM+' MXN / month':FREE+' swipes a day'}</span></div>
    ${premium?'':`<button class="cellr" type="button" id="upg" style="color:var(--tint);font-weight:600">Upgrade to Premium${CHEV}</button>`}</div>
   <div class="sec">Activity</div><div class="group"><div class="cellr">Saved workers<span class="val">${savedOrder.length}</span></div><div class="cellr">Hires through Homely<span class="val">${hires}</span></div></div>
   <div class="sec">Settings</div><div class="group">
    <div class="cellr">Notifications<button class="switch" id="notif" type="button" role="switch" aria-checked="${notif}" aria-label="Notifications"></button></div>
    <div class="cellr">Search area<span class="val">Santa Fe, CDMX</span></div>
    <button class="cellr" type="button" id="privacy">Privacy notice${CHEV}</button>
    <button class="cellr" type="button" id="help">Help and Trust &amp; Safety${CHEV}</button></div>
   <div class="sec">Demo</div><div class="group"><button class="cellr redtxt" type="button" id="resetBtn">Reset Demo</button></div>
   <div class="foot">Clears your swipes, saved workers, chats, hires and Premium, so the app starts like it's your first time.</div>
   <div class="ver">Homely 1.0 · Class demo</div>`;
  if($('upg')) $('upg').onclick=()=>paywall('upgrade');
  $('notif').onclick=()=>{notif=!notif;$('notif').setAttribute('aria-checked',notif)};
  $('privacy').onclick=()=>banner('Homely','Your ID and background data are only used for verification.');
  $('help').onclick=()=>banner('Homely Trust & Safety','We reply to every report within 24 hours.');
  $('resetBtn').onclick=()=>{
    overlay(`<div class="asheet"><div class="agroup"><div class="ah">Reset the demo? Everything goes back to how it was the first time you opened the app.</div>
     <button type="button" class="red" id="rsOk">Reset Demo</button></div><div class="agroup"><button type="button" class="bold" id="rsNo">Cancel</button></div></div>`);
    $('rsOk').onclick=resetAll; $('rsNo').onclick=closeOv;
  };
}
function resetAll(){
  premium=false; used=0; seen=new Set(); hist=[]; undoTop=null; notif=true; filt={av:'All',areas:[],sk:[]};
  for(const k in status) delete status[k];
  for(const k in chats) delete chats[k];
  unread.clear(); savedOrder=[]; gotCodes.clear(); chatId=null;
  for(let i=W.length-1;i>=0;i--) if(W[i].fresh||W[i].gen) W.splice(i,1);
  genId=1000;
  ws=0; vdone=new Set(); vbusy=null; me={...ME0,sk:[...ME0.sk]}; delete me.id;
  seed(); closeOv(); $('bannerHost').innerHTML=''; $('sChat').hidden=true; $('sWP').hidden=true;
  setMode('hire'); updBadge(); renderDeck(); launch();
}

/* ---------- Launch screen ---------- */
let lt;
function launch(){
  const old=$('launch'), L=old.cloneNode(true);
  L.classList.remove('out'); L.hidden=false; old.replaceWith(L);
  const hide=()=>{clearTimeout(lt);L.classList.add('out');setTimeout(()=>{L.hidden=true},500)};
  L.onclick=hide; lt=setTimeout(hide,2300);
}

renderDeck(); updBadge(); launch();
</script>
</html>
